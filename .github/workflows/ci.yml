name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-nix
      - name: Check flake
        run: nix flake check
      - name: Run pre-commit hooks
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
      - name: Check generated bindings for wasm32
        run: nix develop -c cargo check -p wasm-junction --test bindgen_calls --test bindgen_handles --test bindgen_resources --test bindgen_streams --test bindgen_with --target wasm32-unknown-unknown --no-default-features --locked
      - name: Check without WASI
        run: |
          nix develop -c cargo check -p wasm-junction-wasmtime --no-default-features --locked
          nix develop -c cargo check -p wasm-junction --no-default-features --features wasmtime --locked
      - name: Check WASI Preview 3
        run: nix develop -c cargo check -p wasm-junction --no-default-features --features wasmtime,wasi-p3 --locked
      - name: Test WASI Preview 3
        run: |
          nix develop -c cargo nextest run -p wasm-junction-wasmtime --features wasi-p3 --locked
          nix develop -c cargo nextest run -p wasm-junction --no-default-features --features wasmtime,wasi-p3 --locked
      - name: Test outgoing HTTP
        run: |
          nix develop -c cargo nextest run -p wasm-junction-wasmtime --features wasi-http --locked
          nix develop -c cargo nextest run -p wasm-junction --no-default-features --features wasmtime,wasi-http --locked
      - name: Test HTTP versions together
        run: |
          nix develop -c cargo nextest run -p wasm-junction-wasmtime --features wasi-http,wasi-p3 --locked
          nix develop -c cargo nextest run -p wasm-junction --no-default-features --features wasmtime,wasi-http,wasi-p3 --locked
      - name: Read Playwright version
        id: playwright
        run: |
          version="$(nix develop -c sh -c 'node "$PLAYWRIGHT_NODE_PATH/cli.js" --version' | tail -n 1)"
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers and system dependencies
        run: nix develop -c sh -c 'node "$PLAYWRIGHT_NODE_PATH/cli.js" install --with-deps chromium firefox webkit'
      - name: Run pre-push hooks
        run: nix develop -c pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
      - name: Test without the default engine
        run: nix develop -c cargo nextest run -p wasm-junction --no-default-features --locked
      - name: Check dependency advisories
        run: nix develop -c cargo deny check advisories
