[workspace]
resolver = "3"
members = [
  "cycle-a", "cycle-b", "dispatch", "notes-summary", "reload-breaking", "reload-v1", "reload-v2",
  "reload-writer", "resource-client", "streams", "translator",
  "value-streams", "writer",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
wit-bindgen = { version = "=0.62.0", features = ["async"] }

[profile.release]
panic = "abort"
