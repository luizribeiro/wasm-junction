[package]
name = "wasm-junction-wasmtime"
description = "Wasmtime engine for wasm-junction"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wasm-junction-core = { path = "../wasm-junction-core", version = "=0.0.0" }
wasmtime = { version = "=49.0.1", default-features = false, features = ["component-model-async", "cranelift", "runtime", "std"] }

[dev-dependencies]
wasm-junction = { path = "../wasm-junction", version = "=0.0.0", default-features = false }
wasm-junction-conformance = { path = "../wasm-junction-conformance", version = "=0.0.0" }
[build-dependencies]
wasm-junction-guest-build = { path = "../wasm-junction-guest-build", version = "=0.0.0" }

[[bench]]
name = "dispatch"
harness = false
