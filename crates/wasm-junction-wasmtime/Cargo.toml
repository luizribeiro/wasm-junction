[package]
name = "wasm-junction-wasmtime"
description = "Wasmtime engine for wasm-junction"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["parallel-compilation", "wasi"]
parallel-compilation = ["wasmtime/parallel-compilation"]
wasi = ["dep:tokio", "dep:wasmtime-wasi"]

[dependencies]
wasm-junction-core = { path = "../wasm-junction-core", version = "=0.0.0" }
tokio = { version = "1", features = ["macros", "sync"], optional = true }
wasmtime = { version = "=49.0.1", default-features = false, features = ["component-model-async", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p2"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }
wasm-junction = { path = "../wasm-junction", version = "=0.0.0", default-features = false, features = ["wasi"] }
wasm-junction-conformance = { path = "../wasm-junction-conformance", version = "=0.0.0" }
[build-dependencies]
wasm-junction-guest-build = { path = "../wasm-junction-guest-build", version = "=0.0.0" }

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "wasi"
harness = false
required-features = ["wasi"]

[[bench]]
name = "reload"
harness = false
