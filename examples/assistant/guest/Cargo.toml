[workspace]
resolver = "3"
members = ["agent", "http-error", "notes-tools", "weather-tools", "web-tools"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false

[workspace.dependencies]
serde_json = "1.0.145"
wasip3 = "=0.9.0"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["async", "async-spawn", "macros", "realloc"] }

[profile.release]
panic = "abort"
