[workspace]
resolver = "3"
members = [
  "crates/wasm-junction",
  "crates/wasm-junction-conformance",
  "crates/wasm-junction-wasmtime",
  "examples/greeter",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/wasm-junction"
version = "0.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
